{% extends 'base.html' %}{% block content %}<h2>{{ 'Edit' if department else 'Add' }} Department</h2><form method="post" class="card p-4 mt-3"><label class="form-label">Name</label><input name="name" class="form-control mb-3" value="{{ department.name if department else '' }}" required><label class="form-label">Location</label><input name="location" class="form-control mb-3" value="{{ department.location if department else '' }}"><button class="btn btn-primary">Save</button> <a href="{{ url_for('departments.index') }}" class="btn btn-secondary">Cancel</a></form>{% endblock %}
