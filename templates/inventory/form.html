{% extends 'base.html' %}{% block content %}<h2>{{ 'Edit' if batch else 'Add' }} Inventory Batch</h2><form method="post" class="card p-4 mt-3"><div class="row g-3"><div class="col-md-6"><label class="form-label">Supply</label><select name="supply_id" class="form-select" required>{% for s in supplies %}<option value="{{ s.id }}" {% if batch and batch.supply_id==s.id %}selected{% endif %}>{{ s.name }}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label">Supplier</label><select name="supplier_id" class="form-select" required>{% for s in suppliers %}<option value="{{ s.id }}" {% if batch and batch.supplier_id==s.id %}selected{% endif %}>{{ s.name }}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label">Batch Number</label><input name="batch_number" class="form-control" value="{{ batch.batch_number if batch else '' }}" required></div><div class="col-md-3"><label class="form-label">Quantity</label><input name="quantity" type="number" min="0" class="form-control" value="{{ batch.quantity if batch else 1 }}" required></div><div class="col-md-3"><label class="form-label">Unit Price</label><input name="unit_price" type="number" min="0" step="0.01" class="form-control" value="{{ batch.unit_price if batch else 0 }}" required></div><div class="col-md-4"><label class="form-label">Manufacturing Date</label><input name="manufacturing_date" type="date" class="form-control" value="{{ batch.manufacturing_date if batch and batch.manufacturing_date else '' }}"></div><div class="col-md-4"><label class="form-label">Expiry Date</label><input name="expiry_date" type="date" class="form-control" value="{{ batch.expiry_date if batch else '' }}" required></div><div class="col-md-4"><label class="form-label">Received Date</label><input name="received_date" type="date" class="form-control" value="{{ batch.received_date if batch else '' }}" required></div></div><div class="mt-4"><button class="btn btn-primary">Save</button> <a href="{{ url_for('inventory.index') }}" class="btn btn-secondary">Cancel</a></div></form>{% endblock %}
