{% extends 'base.html' %}{% block content %}<h2>Create Purchase Order</h2><form method="post" class="card p-4 mt-3"><div class="row g-3 mb-4"><div class="col-md-5"><label class="form-label">Supplier</label><select name="supplier_id" class="form-select" required>{% for s in suppliers %}<option value="{{ s.id }}">{{ s.name }}</option>{% endfor %}</select></div><div class="col-md-3"><label class="form-label">Order Date</label><input name="order_date" type="date" class="form-control" value="{{ request.form.get('order_date','') }}" required></div><div class="col-md-3"><label class="form-label">Expected Date</label><input name="expected_date" type="date" class="form-control"></div></div><h5>Items</h5><div class="table-responsive"><table class="table"><thead><tr><th>Supply</th><th>Quantity</th><th>Unit Price</th></tr></thead><tbody>{% for s in supplies %}<tr><td>{{ s.name }} <small class="text-muted">({{ s.unit }})</small></td><td><input name="qty_{{ s.id }}" type="number" min="0" class="form-control" placeholder="0"></td><td><input name="price_{{ s.id }}" type="number" min="0" step="0.01" class="form-control" placeholder="0.00"></td></tr>{% endfor %}</tbody></table></div><button class="btn btn-primary">Create Order</button> <a href="{{ url_for('purchases.index') }}" class="btn btn-secondary">Cancel</a></form>{% endblock %}
