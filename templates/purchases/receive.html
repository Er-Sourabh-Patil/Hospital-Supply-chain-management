{% extends 'base.html' %}{% block content %}<h2>Receive Purchase Order #{{ order.id }}</h2><p class="text-muted">Enter batch details. Receiving will increase inventory.</p><form method="post" class="card p-4"><div class="table-responsive"><table class="table"><thead><tr><th>Supply</th><th>Ordered Qty</th><th>Received Qty</th><th>Batch Number</th><th>Expiry Date</th></tr></thead><tbody>{% for i in order.items %}<tr><td>{{ i.supply.name }}</td><td>{{ i.quantity }}</td><td><input name="qty_{{ i.id }}" type="number" min="1" value="{{ i.quantity }}" class="form-control" required></td><td><input name="batch_{{ i.id }}" class="form-control" required></td><td><input name="expiry_{{ i.id }}" type="date" class="form-control" required></td></tr>{% endfor %}</tbody></table></div><button class="btn btn-primary">Receive & Update Inventory</button> <a href="{{ url_for('purchases.detail',id=order.id) }}" class="btn btn-secondary">Cancel</a></form>{% endblock %}
