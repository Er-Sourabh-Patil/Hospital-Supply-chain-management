{% extends 'base.html' %}{% block content %}<h2>Create Supply Request</h2><form method="post" class="card p-4 mt-3"><div class="row g-3 mb-4"><div class="col-md-5"><label class="form-label">Department</label><select name="department_id" class="form-select" required>{% for d in departments %}<option value="{{ d.id }}">{{ d.name }}</option>{% endfor %}</select></div><div class="col-md-4"><label class="form-label">Priority</label><select name="priority" class="form-select">{% for p in ['Low','Normal','High','Urgent'] %}<option>{{ p }}</option>{% endfor %}</select></div></div><h5>Requested Supplies</h5><div class="table-responsive"><table class="table"><thead><tr><th>Supply</th><th>Current Stock</th><th>Quantity Requested</th></tr></thead><tbody>{% for s in supplies %}<tr><td>{{ s.name }}</td><td>{{ s.current_stock }} {{ s.unit }}</td><td><input name="qty_{{ s.id }}" type="number" min="0" class="form-control" placeholder="0"></td></tr>{% endfor %}</tbody></table></div><button class="btn btn-primary">Create Request</button> <a href="{{ url_for('requests.index') }}" class="btn btn-secondary">Cancel</a></form>{% endblock %}
