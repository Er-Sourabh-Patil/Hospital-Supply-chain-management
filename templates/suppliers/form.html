{% extends 'base.html' %}{% block content %}<h2>{{ 'Edit' if supplier else 'Add' }} Supplier</h2><form method="post" class="card p-4 mt-3"><div class="row g-3"><div class="col-md-6"><label class="form-label">Name</label><input name="name" class="form-control" value="{{ supplier.name if supplier else '' }}" required></div><div class="col-md-6"><label class="form-label">Contact Person</label><input name="contact_person" class="form-control" value="{{ supplier.contact_person if supplier else '' }}"></div><div class="col-md-6"><label class="form-label">Phone</label><input name="phone" class="form-control" value="{{ supplier.phone if supplier else '' }}"></div><div class="col-md-6"><label class="form-label">Email</label><input name="email" type="email" class="form-control" value="{{ supplier.email if supplier else '' }}"></div><div class="col-12"><label class="form-label">Address</label><input name="address" class="form-control" value="{{ supplier.address if supplier else '' }}"></div><div class="col-md-4"><label class="form-label">Status</label><select name="status" class="form-select"><option>Active</option><option {% if supplier and supplier.status=='Inactive' %}selected{% endif %}>Inactive</option></select></div></div><div class="mt-4"><button class="btn btn-primary">Save</button> <a href="{{ url_for('suppliers.index') }}" class="btn btn-secondary">Cancel</a></div></form>{% endblock %}
