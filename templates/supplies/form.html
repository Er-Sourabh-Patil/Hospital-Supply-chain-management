{% extends 'base.html' %}{% block content %}<h2>{{ 'Edit' if supply else 'Add' }} Medical Supply</h2><form method="post" class="card p-4 mt-3"><div class="row g-3"><div class="col-md-6"><label class="form-label">Name</label><input name="name" class="form-control" value="{{ supply.name if supply else '' }}" required></div><div class="col-md-6"><label class="form-label">Category</label><select name="category" class="form-select">{% for c in ['Medicines','PPE','Surgical Supplies','Laboratory Supplies','Medical Equipment','Cleaning Supplies'] %}<option {% if supply and supply.category==c %}selected{% endif %}>{{ c }}</option>{% endfor %}</select></div><div class="col-md-4"><label class="form-label">Unit</label><input name="unit" class="form-control" value="{{ supply.unit if supply else '' }}" required></div><div class="col-md-4"><label class="form-label">Minimum Stock</label><input name="minimum_stock" type="number" min="0" class="form-control" value="{{ supply.minimum_stock if supply else 0 }}" required></div><div class="col-12"><label class="form-label">Description</label><textarea name="description" class="form-control">{{ supply.description if supply else '' }}</textarea></div></div><div class="mt-4"><button class="btn btn-primary">Save</button> <a href="{{ url_for('supplies.index') }}" class="btn btn-secondary">Cancel</a></div></form>{% endblock %}
